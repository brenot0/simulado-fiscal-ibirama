rect=0;wrong=[];el('setup').hidden=true;el('result').hidden=true;el('game').hidden=false;show()}function show(){selected=-1;const q=items[idx];el('progress').textContent='Questão '+(idx+1)+' de '+items.length+' • Acertos: '+correct;el('question').textContent=q.q;el('options').innerHTML='';q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent='ABCDE'[i]+') '+o;b.onclick=()=>{selected=i;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};el('options').appendChild(b)});el('check').hidden=false;el('feedback').hidden=true;el('next').hidden=true}function check(){if(selected<0){alert('Escolha uma alternativa, amor 💗');return}const q=items[idx];const ok=selected===q.c;if(ok)correct++;else wrong.push(q.id);el('feedback').hidden=false;el('feedback').textContent=ok?'💚 Parabéns amor eu te amo!':'💗 Calma amor é assim ó: a resposta certa é '+ 'ABCDE'[q.c]+') '+q.o[q.c]+'. '+q.e;el('check').hidden=true;el('next').hidden=false;el('next').textContent=idx===items.length-1?'Ver resultado':'Próxima questão →';localStorage.setItem('fiscal-amor-ultimo',JSON.stringify({acertos:correct,respondidas:idx+1,total:items.length,erros:wrong}))}function next(){idx++;if(idx<items.length)show();else{el('game').hidden=true;el('result').hidden=false;el('result').innerHTML='<h2>Fim do simulado ❤️</h2><p>Você acertou <b>'+correct+' de '+items.length+'</b> ('+Math.round(100*correct/items.length)+'%).</p><p>Tenho muito orgulho de você, amor! 💗</p><button onclick="location.reload()">Fazer outro simulado</button>'}}</script></body></html>
